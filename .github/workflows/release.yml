# Publishes a release when a version tag is pushed:
#   git tag v1.0.1; git push origin v1.0.1
# The tag must match ModuleVersion in module/NAVGit/NAVGit.psd1 and "version" in vscode/package.json.
#
# Authentication:
#   PowerShell Gallery  repository secret PSGALLERY_API_KEY, from https://www.powershellgallery.com/account/apikeys
#                       (scope: push new packages and versions, glob pattern NAVGit).
#
# The VS Code extension is not published here: the .vsix is attached to the GitHub release and uploaded to the
# Marketplace by hand at https://marketplace.visualstudio.com/manage.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  version:
    name: Check versions
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - name: Compare tag, module and extension versions
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $module = (Import-PowerShellDataFile -Path module/NAVGit/NAVGit.psd1).ModuleVersion
          $extension = (Get-Content -LiteralPath vscode/package.json -Raw | ConvertFrom-Json).version
          "Tag $tag, module $module, extension $extension"
          if ($module -ne $tag -or $extension -ne $tag) {
              throw "Version mismatch: set ModuleVersion and package.json version to $tag before tagging."
          }

  test:
    name: Tests
    needs: version
    uses: ./.github/workflows/ci.yml

  publish-module:
    name: Publish to the PowerShell Gallery
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      # Only module/NAVGit is published (not the tests). Point at the manifest: given the folder, Publish-PSResource
      # takes the first .psd1 it finds, which is Commands.psd1 (a data file, not a manifest).
      - name: Publish NAVGit
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: Publish-PSResource -Path module/NAVGit/NAVGit.psd1 -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY

  package-extension:
    name: Package the VS Code extension
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22   # vsce 4 needs Node 22 or later

      - run: npm ci

      # vscode:prepublish type-checks, copies the module into the extension and bundles it.
      - name: Package extension
        run: npx vsce package

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vscode/*.vsix
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    needs: [publish-module, package-extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: vsix

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" vsix/*.vsix --title "NAVGit ${{ github.ref_name }}" --generate-notes
